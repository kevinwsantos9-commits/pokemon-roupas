name: Compilar ROM (FireRed + Roupas)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi git libpng-dev unzip

      - name: Baixar o pokefirered (versao exata) e aplicar o sistema de roupas
        run: |
          mkdir ../pf && cd ../pf
          git init -q
          git remote add origin https://github.com/pret/pokefirered.git
          git fetch --depth 1 origin ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          git checkout -q FETCH_HEAD
          unzip -o -q "$GITHUB_WORKSPACE/overlay.zip" -d .

      - name: Compilar o agbcc (compilador C do GBA)
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git ../agbcc
          cd ../agbcc
          ./build.sh
          ./install.sh ../pf

      - name: Compilar a ROM
        run: |
          cd ../pf
          make -j"$(nproc)"
          cp pokefirered.gba "$GITHUB_WORKSPACE/pokefirered.gba"

      - name: Enviar a ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokefirered-roupas
          path: pokefirered.gba
